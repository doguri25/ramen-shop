# v로 시작하는 태그(예: v1.0.0)를 올리면 빌드해서 GitHub 릴리스를 만들고 배포 파일을 붙여요.
name: 릴리스 만들기

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: 배포 파일 묶기
        run: |
          cd dist
          zip -qr "../ramen-shop-${GITHUB_REF_NAME}.zip" .

      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="ramen-shop-${GITHUB_REF_NAME}.zip"
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          # GitHub 화면에서 릴리스를 먼저 만든 경우: 배포 파일을 붙이고, 설명이 비어 있으면 릴리스 노트로 채워요
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
            BODY=$(gh release view "$GITHUB_REF_NAME" --json body -q .body)
            if [ -z "$BODY" ] && [ -f "$NOTES" ]; then gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES"; fi
          else
            if [ -f "$NOTES" ]; then ARGS=(--notes-file "$NOTES"); else ARGS=(--generate-notes); fi
            gh release create "$GITHUB_REF_NAME" "$ZIP" --title "후루룩 친구라면 가게 ${GITHUB_REF_NAME}" "${ARGS[@]}"
          fi
